spring.application.name=ailogis-api
server.port=8080

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ailogis}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# AWS S3
aws.s3.bucket-name=ailogis-storage-bucket-492017761328-ap-southeast-1-an
aws.region=ap-southeast-1
aws.access-key-id=${AWS_ACCESS_KEY_ID:accesskey}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:secretkey}

# JWT
jwt.secret=${JWT_SECRET:your_jwt_secret_here}
jwt.expiration=3600000

# VNPAY CONFIG (Sandbox)
vnpay.tmnCode=${VNPAY_TMNCODE}
vnpay.hashSecret=${VNPAY_HASHSECREY}
vnpay.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=http://localhost:8080/api/payment/vnpay-return
frontend.payment-success-url=http://localhost:5173/payment-success
frontend.payment-fail-url=http://localhost:5173/payment-fail
vnpay.apiUrl=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction

# FILE UPLOAD CONFIGURATION
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB