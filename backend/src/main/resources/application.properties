spring.application.name=ailogis-api
server.port=8080

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ailogis}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# AWS S3
aws.s3.bucket-name=ailogis-storage-bucket-492017761328-ap-southeast-1-an
aws.region=ap-southeast-1
aws.access-key-id=${AWS_ACCESS_KEY_ID:accesskey}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:secretkey}

# JWT
jwt.secret=${JWT_SECRET:your_jwt_secret_here}
jwt.expiration=3600000

# PAYOS CONFIG
payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}
payos.return-url=${PAYOS_RETURN_URL:https://api.logicha.io.vn/api/payment/payos-return}
payos.webhook-url=${PAYOS_WEBHOOK_URL:https://api.logicha.io.vn/api/payment/payos-webhook}
frontend.payment-success-url=${FE_SUCCESS_URL:https://api.logicha.io.vn/payment-success}
frontend.payment-fail-url=${FE_FAIL_URL:https://api.logicha.io.vn/payment-fail}

# FILE UPLOAD CONFIGURATION
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# MAIL (SMTP) CONFIGURATION
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# PASSWORD RESET OTP CONFIGURATION
app.otp.expiration-minutes=2
app.otp.length=6
app.otp.max-attempts=3
app.otp.resend-cooldown-seconds=60
app.mail.from=${MAIL_FROM:no-reply@logicha.io.vn}

# LOGIN ATTEMPT LIMIT (khóa tạm sau N lần sai mật khẩu)
app.login.max-failed-attempts=5
app.login.lock-duration-minutes=5